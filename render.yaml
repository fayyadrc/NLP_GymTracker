services:
  # Combined Service: Backend + Frontend (FastAPI + Vite SPA)
  - type: web
    name: gymtracker
    runtime: python
    repo: https://github.com/fayyadrc/NLP_GymTracker
    branch: main
    autoDeployTrigger: commit
    # Build frontend first (bakes VITE_* at build time), then install backend deps
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r requirements.txt
    # Must be Python/uvicorn — NOT npm/node start (Express 404 means wrong runtime)
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PUBLIC_APP_URL
        value: https://gymtracker.onrender.com
      - key: VITE_PUBLIC_APP_URL
        value: https://gymtracker.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_APP_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    # Rebuild if anything in backend or frontend changes
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - mcp/**
        - requirements.txt
        - runtime.txt
