services:
  # Combined Service: Backend + Frontend
  - type: web
    name: gymtracker
    runtime: python
    # Build frontend first, then install backend dependencies
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    # Run Uvicorn from the root
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPABASE_URL
        value: https://olppdhmwjkeuvkxihhcj.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://gymtracker.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://olppdhmwjkeuvkxihhcj.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_APP_URL
        value: https://gymtracker.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    # Rebuild if anything in backend or frontend changes
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - mcp/**
        - requirements.txt
        - runtime.txt
