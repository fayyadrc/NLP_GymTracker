[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repcount-mcp"
version = "0.1.0"
description = "RepCount MCP server package for GymTrackerAI"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.13.3",
    "supabase>=2.23.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repcount_mcp*"]
